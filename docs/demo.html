<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://image.tmdb.org data:; connect-src 'self'; frame-src 'none';">
  <title>Try It Live — Film Recommendation Engine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0015;
      color: #e0d6f0;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-stars .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
      opacity: 0;
    }
    @keyframes twinkle {
      0% { opacity: 0.1; transform: scale(0.8); }
      100% { opacity: var(--peak); transform: scale(1.2); }
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-glow .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
    }
    .bg-glow .orb1 {
      width: 400px; height: 400px;
      background: #7b61ff;
      top: -100px; left: -100px;
      animation: orbFloat1 12s ease-in-out infinite alternate;
    }
    .bg-glow .orb2 {
      width: 300px; height: 300px;
      background: #00e5ff;
      bottom: -50px; right: -50px;
      animation: orbFloat2 15s ease-in-out infinite alternate;
    }
    .bg-glow .orb3 {
      width: 250px; height: 250px;
      background: #ff2d95;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: orbFloat3 10s ease-in-out infinite alternate;
    }
    @keyframes orbFloat1 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(80px, 60px); }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-60px, -80px); }
    }
    @keyframes orbFloat3 {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.08; }
      100% { transform: translate(-30%, -40%) scale(1.3); opacity: 0.15; }
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      pointer-events: none;
      z-index: 1000;
    }

    .header {
      text-align: center;
      padding: 40px 20px 20px;
      background: linear-gradient(180deg, rgba(10,0,21,0.9) 0%, rgba(26,10,46,0.9) 100%);
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      background: linear-gradient(180deg, #00e5ff, #7b61ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 15px rgba(0,229,255,0.3));
    }

    .header p {
      color: #c084fc;
      font-size: 13px;
      letter-spacing: 0.2em;
      margin-top: 8px;
    }

    .back-link {
      display: inline-block;
      margin-top: 12px;
      color: #00e5ff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      background: #1a0a2e;
      border: 1.5px solid rgba(123,97,255,0.5);
      border-radius: 12px;
      padding: 16px 50px 16px 44px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #00e5ff; }
    .search-input::placeholder { color: rgba(123,97,255,0.5); }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #00e5ff;
      font-size: 18px;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ff2d95;
      font-size: 18px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }
    .clear-btn.visible { display: block; }

    .suggestions {
      background: #1a0a2e;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      display: none;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid rgba(123,97,255,0.3);
    }
    .suggestions.visible { display: block; }

    .suggestion-item {
      padding: 12px 16px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(123,97,255,0.1);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: rgba(0,229,255,0.1); }
    .suggestion-item .match { color: #00e5ff; font-weight: bold; }

    .results { display: none; }
    .results.visible { display: block; }

    .results-header {
      margin-bottom: 16px;
    }
    .results-header .label {
      font-size: 12px;
      color: rgba(255,45,149,0.7);
      letter-spacing: 1px;
    }
    .results-header .movie-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #00e5ff;
      margin-top: 4px;
    }

    .coverflow {
      position: relative;
      width: 100%;
      height: 360px;
      perspective: 600px;
      overflow: hidden;
      margin: 20px 0 0;
    }

    .coverflow-slide {
      position: absolute;
      left: 50%;
      top: 0;
      width: 200px;
      margin-left: -100px;
      transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease;
      transform-style: preserve-3d;
      cursor: pointer;
      opacity: 0;
      z-index: 0;
      pointer-events: none;
    }

    .coverflow-slide.pos-center {
      transform: translateX(0) rotateY(0deg) scale(1);
      opacity: 1;
      z-index: 5;
      pointer-events: auto;
      cursor: default;
    }

    .coverflow-slide.pos-left-1 {
      transform: translateX(-260px) rotateY(55deg) scale(0.6);
      opacity: 0.6;
      z-index: 4;
      pointer-events: auto;
    }

    .coverflow-slide.pos-right-1 {
      transform: translateX(260px) rotateY(-55deg) scale(0.6);
      opacity: 0.6;
      z-index: 4;
      pointer-events: auto;
    }

    .coverflow-slide.pos-left-2 {
      transform: translateX(-380px) rotateY(55deg) scale(0.45);
      opacity: 0.3;
      z-index: 3;
      pointer-events: auto;
    }

    .coverflow-slide.pos-right-2 {
      transform: translateX(380px) rotateY(-55deg) scale(0.45);
      opacity: 0.3;
      z-index: 3;
      pointer-events: auto;
    }

    .coverflow-poster {
      width: 200px;
      height: 300px;
      border-radius: 4px;
      object-fit: cover;
      background: #2a1a4e;
      box-shadow: 0 4px 24px rgba(0,0,0,0.7);
      display: block;
    }

    .coverflow-poster-fallback {
      width: 200px;
      height: 300px;
      border-radius: 4px;
      background: #2a1a4e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.7);
    }

    .coverflow-reflect {
      width: 200px;
      height: 50px;
      border-radius: 0 0 4px 4px;
      object-fit: cover;
      object-position: bottom;
      transform: scaleY(-1);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent 60%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent 60%);
      margin-top: -1px;
      pointer-events: none;
      display: block;
    }

    .coverflow-info {
      text-align: center;
      padding: 16px 0 4px;
      position: relative;
    }

    .coverflow-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .coverflow-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
    }

    .coverflow-year {
      font-size: 12px;
      color: rgba(123,97,255,0.7);
    }

    .coverflow-score {
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .coverflow-score.high { color: #00e5ff; background: rgba(0,229,255,0.2); }
    .coverflow-score.mid { color: #7b61ff; background: rgba(123,97,255,0.2); }
    .coverflow-score.low { color: #ff2d95; background: rgba(255,45,149,0.2); }

    .coverflow-divider {
      width: 80%;
      max-width: 500px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(123,97,255,0.3), transparent);
      margin: 0 auto 8px;
    }

    .carousel-counter {
      text-align: center;
      font-size: 11px;
      color: rgba(192,132,252,0.5);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(192,132,252,0.5);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    .neon-sep {
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff2d95, transparent);
      margin: 24px 0;
      opacity: 0.4;
    }

    .stats {
      text-align: center;
      font-size: 11px;
      color: rgba(192,132,252,0.4);
      padding: 20px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }
    .stats span { color: #00e5ff; }

    .suggestions::-webkit-scrollbar { width: 6px; }
    .suggestions::-webkit-scrollbar-track { background: transparent; }
    .suggestions::-webkit-scrollbar-thumb { background: rgba(123,97,255,0.3); border-radius: 3px; }
  </style>
</head>
<body>

<div class="bg-glow">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<div class="bg-stars" id="bgStars"></div>

<div class="header">
  <h1>TRY IT LIVE</h1>
  <p>FILM RECOMMENDATION ENGINE</p>
  <a href="index.html" class="back-link">&larr; BACK TO HOME</a>
</div>

<div class="container">
  <div class="search-box">
    <span class="search-icon">&#128269;</span>
    <input type="text" class="search-input" id="searchInput" placeholder="Search for a movie..." autocomplete="off" autocorrect="off" spellcheck="false" maxlength="100">
    <button class="clear-btn" id="clearBtn">&#10005;</button>
  </div>

  <div class="suggestions" id="suggestions"></div>

  <div class="results" id="results">
    <div class="results-header">
      <div class="label">Because you liked</div>
      <div class="movie-name" id="selectedMovie"></div>
    </div>
    <div class="coverflow" id="coverflow"></div>
    <div class="coverflow-divider"></div>
    <div class="coverflow-info" id="coverflowInfo"></div>
    <div class="carousel-counter" id="carouselCounter"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="icon">&#127916;</div>
    <p>Search for a movie you love.<br>We'll find 5 films you'll probably love too.</p>
    <div class="neon-sep"></div>
    <p style="font-size: 11px; opacity: 0.6;">Content-based &bull; KNN + Gaussian scoring &bull; TMDb 5000</p>
  </div>
</div>

<div class="stats">
  <span>4,803</span> movies &bull; <span id="precomputedCount">0</span> pre-computed &bull; <span>5</span> recommendations each
</div>

<script>
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function sanitizeInput(str) {
  return str.replace(/[\x00-\x1f\x7f]/g, '').slice(0, 100);
}

let DB = {};

const CACHE_KEY = 'filmrec_db';
const CACHE_VERSION = 'v3';

async function loadDatabase() {
  const cached = localStorage.getItem(CACHE_KEY);
  const cachedPosters = localStorage.getItem(CACHE_KEY + '_posters');
  const cachedVersion = localStorage.getItem(CACHE_KEY + '_v');
  if (cached && cachedPosters && cachedVersion === CACHE_VERSION) {
    DB = JSON.parse(cached);
    POSTERS = JSON.parse(cachedPosters);
    onDatabaseLoaded();
    return;
  }
  try {
    const [dbResp, posterResp] = await Promise.all([
      fetch('demo_db.json'),
      fetch('posters.json')
    ]);
    DB = await dbResp.json();
    POSTERS = await posterResp.json();
    localStorage.setItem(CACHE_KEY, JSON.stringify(DB));
    localStorage.setItem(CACHE_KEY + '_posters', JSON.stringify(POSTERS));
    localStorage.setItem(CACHE_KEY + '_v', CACHE_VERSION);
  } catch (e) {
    console.error('Failed to load database:', e);
  }
  onDatabaseLoaded();
}

function onDatabaseLoaded() {
  TITLES.length = 0;
  TITLES.push(...Object.keys(DB));
  document.getElementById('precomputedCount').textContent = TITLES.length.toLocaleString();
}

let POSTERS = {};

const TMDB_IMG = "https://image.tmdb.org/t/p/";

const TITLES = [];
loadDatabase();

const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const suggestionsEl = document.getElementById('suggestions');
const resultsEl = document.getElementById('results');
const selectedMovieEl = document.getElementById('selectedMovie');
const coverflowEl = document.getElementById('coverflow');
const coverflowInfo = document.getElementById('coverflowInfo');
const carouselCounter = document.getElementById('carouselCounter');
const emptyState = document.getElementById('emptyState');
let currentSlide = 0;
let slideCount = 0;
let currentRecs = [];

input.addEventListener('input', () => {
  const q = sanitizeInput(input.value).trim().toLowerCase();
  clearBtn.classList.toggle('visible', input.value.length > 0);

  if (q.length < 2) {
    suggestionsEl.classList.remove('visible');
    return;
  }

  const matches = TITLES.filter(t => t.toLowerCase().includes(q)).slice(0, 8);

  if (matches.length === 0) {
    suggestionsEl.classList.remove('visible');
    return;
  }

  suggestionsEl.innerHTML = matches.map(title => {
    const safe = escapeHtml(title);
    const idx = title.toLowerCase().indexOf(q);
    const before = escapeHtml(title.substring(0, idx));
    const match = escapeHtml(title.substring(idx, idx + q.length));
    const after = escapeHtml(title.substring(idx + q.length));
    return `<div class="suggestion-item" data-title="${safe}">${before}<span class="match">${match}</span>${after}</div>`;
  }).join('');
  suggestionsEl.classList.add('visible');
});

suggestionsEl.addEventListener('click', (e) => {
  const item = e.target.closest('.suggestion-item');
  if (!item) return;
  selectMovie(item.dataset.title);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.classList.remove('visible');
  suggestionsEl.classList.remove('visible');
  resultsEl.classList.remove('visible');
  emptyState.style.display = '';
  input.focus();
});

const POS_CLASSES = ['pos-left-2', 'pos-left-1', 'pos-center', 'pos-right-1', 'pos-right-2'];

function goToSlide(idx) {
  if (idx < 0 || idx >= slideCount) return;
  currentSlide = idx;
  const slides = coverflowEl.querySelectorAll('.coverflow-slide');
  slides.forEach((s, i) => {
    POS_CLASSES.forEach(c => s.classList.remove(c));
    const offset = i - idx;
    if (offset === 0) s.classList.add('pos-center');
    else if (offset === -1) s.classList.add('pos-left-1');
    else if (offset === 1) s.classList.add('pos-right-1');
    else if (offset === -2) s.classList.add('pos-left-2');
    else if (offset === 2) s.classList.add('pos-right-2');
    s.style.opacity = Math.abs(offset) > 2 ? '0' : '';
    s.style.pointerEvents = Math.abs(offset) > 2 ? 'none' : '';
  });

  const r = currentRecs[idx];
  const scoreClass = r.imdb >= 8.0 ? 'high' : r.imdb >= 7.0 ? 'mid' : 'low';
  coverflowInfo.innerHTML = `
    <div class="coverflow-title">${escapeHtml(r.title)}</div>
    <div class="coverflow-meta">
      <span class="coverflow-year">${Number(r.year)}</span>
      <span class="coverflow-score ${scoreClass}">&#9733; ${Number(r.imdb)}</span>
    </div>`;
  carouselCounter.textContent = `${idx + 1} / ${slideCount}`;
}

coverflowEl.addEventListener('click', (e) => {
  const slide = e.target.closest('.coverflow-slide');
  if (!slide) return;
  const idx = parseInt(slide.dataset.idx);
  if (idx !== currentSlide) goToSlide(idx);
});

document.addEventListener('keydown', (e) => {
  if (!resultsEl.classList.contains('visible')) return;
  if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
  if (e.key === 'ArrowRight') goToSlide(currentSlide + 1);
});

let touchStartX = 0, touchStartTime = 0, isDragging = false;
coverflowEl.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartTime = Date.now();
  isDragging = true;
  coverflowEl.querySelectorAll('.coverflow-slide').forEach(s => {
    s.style.transition = 'none';
  });
}, {passive: true});

coverflowEl.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - touchStartX;
  const slides = coverflowEl.querySelectorAll('.coverflow-slide');
  slides.forEach(s => {
    const base = parseFloat(s.style.getPropertyValue('--base-tx') || '0');
    s.style.transform = s.style.transform.replace(/translateX\([^)]+\)/, `translateX(${base + dx * 0.4}px)`);
  });
}, {passive: true});

coverflowEl.addEventListener('touchend', (e) => {
  isDragging = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dt = Date.now() - touchStartTime;
  const velocity = Math.abs(dx) / dt;
  const threshold = velocity > 0.3 ? 20 : 50;
  coverflowEl.querySelectorAll('.coverflow-slide').forEach(s => {
    s.style.transition = '';
  });
  if (Math.abs(dx) > threshold) {
    if (dx < 0) goToSlide(currentSlide + 1);
    else goToSlide(currentSlide - 1);
  } else {
    goToSlide(currentSlide);
  }
}, {passive: true});

function selectMovie(title) {
  input.value = title;
  suggestionsEl.classList.remove('visible');
  clearBtn.classList.add('visible');
  emptyState.style.display = 'none';

  const recs = DB[title];
  if (!recs) return;
  currentRecs = recs;

  selectedMovieEl.textContent = title;

  coverflowEl.innerHTML = recs.map((r, i) => {
    const poster = POSTERS[r.title];
    const safeTitle = escapeHtml(r.title);
    const safePath = poster ? poster.replace(/[^a-zA-Z0-9\/._-]/g, '') : '';
    const posterEl = safePath
      ? `<img class="coverflow-poster" src="${TMDB_IMG}w342${safePath}" alt="${safeTitle}">`
      : `<div class="coverflow-poster-fallback">🎬</div>`;
    const reflectEl = safePath
      ? `<img class="coverflow-reflect" src="${TMDB_IMG}w342${safePath}" alt="">`
      : '';
    return `<div class="coverflow-slide" data-idx="${i}">
      ${posterEl}
      ${reflectEl}
    </div>`;
  }).join('');

  slideCount = recs.length;
  currentSlide = 0;
  goToSlide(0);
  resultsEl.classList.add('visible');
}

input.focus();

(function() {
  const container = document.getElementById('bgStars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    star.style.setProperty('--peak', (0.3 + Math.random() * 0.7).toFixed(2));
    star.style.animationDelay = (Math.random() * 5) + 's';
    star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
    container.appendChild(star);
  }
})();
</script>
</body>
</html>
