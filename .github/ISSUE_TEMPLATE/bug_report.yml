name: Bug Report
description: Report a bug in the recommendation engine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language Implementation
      options:
        - Python
        - Rust
        - Go
        - "C#"
        - Notebook
        - GitHub Pages site
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. Run `make run MOVIE="..."`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
