name: Supabase Keepalive

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Direct Postgres heartbeat
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -c \
            "INSERT INTO keepalive (id, last_ping) VALUES (1, now())
             ON CONFLICT (id) DO UPDATE SET last_ping = now();"
          echo "Heartbeat written via direct Postgres connection"
