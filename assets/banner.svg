<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b96a"/>
      <stop offset="100%" stop-color="#a08040"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4a35a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c4a35a" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c4a35a" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#c4a35a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c4a35a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="softBokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- Subtle vignette -->
  <rect width="900" height="320" fill="url(#bg)" opacity="0"/>
  <ellipse cx="450" cy="160" rx="500" ry="200" fill="none" stroke="#1a1a22" stroke-width="200" opacity="0.3"/>

  <!-- Bokeh particles -->
  <circle cx="120" cy="80" r="4" fill="#c4a35a" opacity="0.12" filter="url(#bokeh)"/>
  <circle cx="780" cy="60" r="3" fill="#c4a35a" opacity="0.1" filter="url(#bokeh)"/>
  <circle cx="650" cy="250" r="5" fill="#c4a35a" opacity="0.08" filter="url(#softBokeh)"/>
  <circle cx="200" cy="240" r="3.5" fill="#c4a35a" opacity="0.1" filter="url(#bokeh)"/>
  <circle cx="450" cy="40" r="2.5" fill="#c4a35a" opacity="0.15" filter="url(#bokeh)"/>
  <circle cx="340" cy="280" r="4" fill="#c4a35a" opacity="0.07" filter="url(#softBokeh)"/>
  <circle cx="60" cy="180" r="3" fill="#c4a35a" opacity="0.09" filter="url(#bokeh)"/>
  <circle cx="830" cy="150" r="4.5" fill="#c4a35a" opacity="0.06" filter="url(#softBokeh)"/>
  <circle cx="500" cy="290" r="2" fill="#c4a35a" opacity="0.12" filter="url(#bokeh)"/>
  <circle cx="720" cy="100" r="3" fill="#c4a35a" opacity="0.11" filter="url(#bokeh)"/>
  <circle cx="280" cy="50" r="2" fill="#d4b96a" opacity="0.13" filter="url(#bokeh)"/>
  <circle cx="580" cy="180" r="3.5" fill="#c4a35a" opacity="0.05" filter="url(#softBokeh)"/>
  <circle cx="150" cy="290" r="2.5" fill="#c4a35a" opacity="0.1" filter="url(#bokeh)"/>
  <circle cx="400" cy="130" r="1.5" fill="#d4b96a" opacity="0.18" filter="url(#bokeh)"/>
  <circle cx="850" cy="270" r="3" fill="#c4a35a" opacity="0.08" filter="url(#bokeh)"/>

  <!-- Small dust particles -->
  <circle cx="90" cy="120" r="1" fill="#c4a35a" opacity="0.2"/>
  <circle cx="300" cy="160" r="0.8" fill="#c4a35a" opacity="0.15"/>
  <circle cx="550" cy="70" r="1" fill="#c4a35a" opacity="0.18"/>
  <circle cx="700" cy="200" r="0.7" fill="#c4a35a" opacity="0.2"/>
  <circle cx="180" cy="190" r="0.9" fill="#c4a35a" opacity="0.12"/>
  <circle cx="620" cy="130" r="1.1" fill="#c4a35a" opacity="0.14"/>
  <circle cx="420" cy="220" r="0.8" fill="#c4a35a" opacity="0.16"/>
  <circle cx="760" cy="280" r="1" fill="#c4a35a" opacity="0.1"/>

  <!-- Horizontal gold accent lines -->
  <line x1="100" y1="115" x2="360" y2="115" stroke="url(#goldLine)" stroke-width="0.5"/>
  <line x1="540" y1="115" x2="800" y2="115" stroke="url(#goldLine)" stroke-width="0.5"/>
  <line x1="100" y1="205" x2="360" y2="205" stroke="url(#goldLine)" stroke-width="0.5"/>
  <line x1="540" y1="205" x2="800" y2="205" stroke="url(#goldLine)" stroke-width="0.5"/>

  <!-- Film strip decoration (left) -->
  <g opacity="0.06">
    <rect x="30" y="60" width="28" height="200" rx="2" fill="none" stroke="#c4a35a" stroke-width="0.8"/>
    <rect x="34" y="68" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="34" y="80" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="34" y="92" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="34" y="104" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="34" y="200" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="34" y="212" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="34" y="224" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="34" y="236" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="68" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="80" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="92" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="104" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="200" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="212" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="224" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="48" y="236" width="6" height="4" rx="1" fill="#c4a35a"/>
  </g>

  <!-- Film strip decoration (right) -->
  <g opacity="0.06">
    <rect x="842" y="60" width="28" height="200" rx="2" fill="none" stroke="#c4a35a" stroke-width="0.8"/>
    <rect x="846" y="68" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="846" y="80" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="846" y="92" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="846" y="104" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="846" y="200" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="846" y="212" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="846" y="224" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="846" y="236" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="68" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="80" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="92" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="104" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="200" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="212" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="224" width="6" height="4" rx="1" fill="#c4a35a"/>
    <rect x="860" y="236" width="6" height="4" rx="1" fill="#c4a35a"/>
  </g>

  <!-- Title -->
  <text x="450" y="148" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#goldText)" filter="url(#glow)" letter-spacing="2">Film Recommendation</text>
  <text x="450" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#goldText)" filter="url(#glow)" letter-spacing="2">Engine</text>

  <!-- Subtitle -->
  <text x="450" y="230" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#726b5e" letter-spacing="4" font-weight="400">SEMANTIC SEARCH  ·  6,707 TITLES  ·  MOVIES &amp; TV SHOWS</text>

  <!-- Version badge -->
  <rect x="405" y="250" width="90" height="22" rx="4" fill="none" stroke="#c4a35a" stroke-width="0.6" opacity="0.3"/>
  <text x="450" y="265" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#c4a35a" opacity="0.5" letter-spacing="1" font-weight="500">v0.9.0</text>
</svg>
