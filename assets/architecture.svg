<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#e8c547"/>
    </linearGradient>
    <linearGradient id="vec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555d70"/>
    </marker>
    <marker id="arrGold" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9a227"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3ECF8E"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7B61FF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="520" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="470" y="36" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="700" fill="#e8c547" letter-spacing="1">Film Recommendation Engine</text>
  <text x="470" y="54" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8890a4" letter-spacing="3">SEMANTIC SIMILARITY · PGVECTOR · REAL-TIME</text>

  <!-- ═══════════════ DATA PIPELINE SECTION ═══════════════ -->
  <rect x="30" y="75" width="880" height="160" rx="8" fill="none" stroke="#2a2f42" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="470" y="96" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394" letter-spacing="3" font-weight="600">DATA PIPELINE</text>

  <!-- Box 1: TMDb API -->
  <rect x="55" y="112" width="160" height="105" rx="8" fill="#1e2235" stroke="#2a3050" stroke-width="1"/>
  <rect x="55" y="112" width="4" height="105" rx="2" fill="#4285F4"/>
  <text x="135" y="142" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#e0e4ef">TMDb API</text>
  <text x="135" y="162" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">4,800 movies</text>
  <text x="135" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">1,907 TV shows</text>
  <text x="135" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#4285F4">posters · trailers · metadata</text>

  <!-- Arrow 1→2 -->
  <line x1="219" y1="164" x2="263" y2="164" stroke="#555d70" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="241" y="156" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#555d70">fetch</text>

  <!-- Box 2: Python ETL -->
  <rect x="270" y="112" width="160" height="105" rx="8" fill="#1e2235" stroke="#2a3050" stroke-width="1"/>
  <rect x="270" y="112" width="4" height="105" rx="2" fill="#34A853"/>
  <text x="350" y="142" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#e0e4ef">Python ETL</text>
  <text x="350" y="162" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">fetch · clean · merge</text>
  <text x="350" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">6,707 title catalog</text>
  <text x="350" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#34A853">overview + genres + cast</text>

  <!-- Arrow 2→3 -->
  <line x1="434" y1="164" x2="478" y2="164" stroke="#555d70" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="456" y="156" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#555d70">text</text>

  <!-- Box 3: Sentence Transformers -->
  <rect x="485" y="112" width="175" height="105" rx="8" fill="#1e2235" stroke="#3d2f6e" stroke-width="1"/>
  <rect x="485" y="112" width="4" height="105" rx="2" fill="url(#vec)"/>
  <text x="572" y="138" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#c4b5fd">sentence-transformers</text>
  <text x="572" y="158" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">all-MiniLM-L6-v2</text>
  <text x="572" y="172" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">384-dim embeddings</text>
  <text x="572" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#7B61FF">normalized cosine vectors</text>

  <!-- Arrow 3→4 -->
  <line x1="664" y1="164" x2="708" y2="164" stroke="#7B61FF" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="686" y="156" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#7B61FF">vector</text>

  <!-- Box 4: Supabase Postgres (pipeline target) -->
  <rect x="715" y="112" width="175" height="105" rx="8" fill="#1a2a1e" stroke="#2a5035" stroke-width="1"/>
  <rect x="715" y="112" width="4" height="105" rx="2" fill="#3ECF8E"/>
  <text x="802" y="138" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#86efac">Supabase Postgres</text>
  <text x="802" y="158" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">movies table + pgvector</text>
  <text x="802" y="172" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">embedding vector(384)</text>
  <text x="802" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#3ECF8E">HNSW index · &lt;10 ms ANN</text>

  <!-- ═══════════════ CENTRAL HIGHLIGHT ═══════════════ -->
  <rect x="300" y="255" width="340" height="52" rx="26" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="470" y="276" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#e8c547" letter-spacing="1">NO PRE-COMPUTED PAIRS</text>
  <text x="470" y="294" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8890a4">New titles are instantly recommendable — just INSERT with embedding</text>

  <!-- ═══════════════ LIVE SERVING SECTION ═══════════════ -->
  <rect x="30" y="325" width="880" height="160" rx="8" fill="none" stroke="#2a2f42" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="470" y="346" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394" letter-spacing="3" font-weight="600">LIVE SERVING</text>

  <!-- Box 5: Browser -->
  <rect x="55" y="362" width="160" height="105" rx="8" fill="#1e2235" stroke="#2a3050" stroke-width="1"/>
  <rect x="55" y="362" width="4" height="105" rx="2" fill="#00ACC1"/>
  <text x="135" y="392" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#e0e4ef">Browser</text>
  <text x="135" y="412" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">Search &amp; Cover Flow</text>
  <text x="135" y="426" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">WebGL bokeh particles</text>
  <text x="135" y="450" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#00ACC1">PWA · offline-capable</text>

  <!-- Arrow 5→6 -->
  <line x1="219" y1="414" x2="263" y2="414" stroke="#555d70" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="241" y="406" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#555d70">visit</text>

  <!-- Box 6: GitHub Pages -->
  <rect x="270" y="362" width="160" height="105" rx="8" fill="#1e2235" stroke="#2a3050" stroke-width="1"/>
  <rect x="270" y="362" width="4" height="105" rx="2" fill="#8b949e"/>
  <text x="350" y="392" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#e0e4ef">GitHub Pages</text>
  <text x="350" y="412" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">SPA · PWA</text>
  <text x="350" y="426" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">single HTML file</text>
  <text x="350" y="450" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e">docs/index.html</text>

  <!-- Arrow 6→7 -->
  <line x1="434" y1="414" x2="478" y2="414" stroke="#3ECF8E" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="456" y="406" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#3ECF8E">RPC</text>

  <!-- Box 7: PostgREST -->
  <rect x="485" y="362" width="175" height="105" rx="8" fill="#1a2a1e" stroke="#2a5035" stroke-width="1"/>
  <rect x="485" y="362" width="4" height="105" rx="2" fill="#3ECF8E"/>
  <text x="572" y="392" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#86efac">PostgREST</text>
  <text x="572" y="412" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">get_recommendations()</text>
  <text x="572" y="426" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">auto-generated REST API</text>
  <text x="572" y="450" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#3ECF8E">cosine similarity via &lt;=&gt;</text>

  <!-- Arrow 7→8 -->
  <line x1="664" y1="414" x2="708" y2="414" stroke="#3ECF8E" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="686" y="406" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#3ECF8E">SQL</text>

  <!-- Box 8: pgvector Search -->
  <rect x="715" y="362" width="175" height="105" rx="8" fill="#1a2a1e" stroke="#2a5035" stroke-width="1"/>
  <rect x="715" y="362" width="4" height="105" rx="2" fill="#e8c547"/>
  <text x="802" y="388" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#e8c547">pgvector HNSW</text>
  <text x="802" y="408" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">approximate nearest</text>
  <text x="802" y="422" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7394">neighbor search</text>
  <text x="802" y="445" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#e8c547">→ top 7 results</text>

  <!-- Vertical connection: Pipeline DB → Live DB -->
  <line x1="802" y1="221" x2="802" y2="358" stroke="#3ECF8E" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="820" y="290" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#3ECF8E" transform="rotate(90, 820, 290)">same table</text>

  <!-- ═══════════════ LEGEND ═══════════════ -->
  <g transform="translate(55, 502)">
    <rect x="0" y="0" width="10" height="3" fill="#4285F4" rx="1"/>
    <text x="14" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#6b7394">Data source</text>
    <rect x="90" y="0" width="10" height="3" fill="#34A853" rx="1"/>
    <text x="104" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#6b7394">Processing</text>
    <rect x="180" y="0" width="10" height="3" fill="#7B61FF" rx="1"/>
    <text x="194" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#6b7394">ML embedding</text>
    <rect x="285" y="0" width="10" height="3" fill="#3ECF8E" rx="1"/>
    <text x="299" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#6b7394">Supabase</text>
    <rect x="365" y="0" width="10" height="3" fill="#e8c547" rx="1"/>
    <text x="379" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#6b7394">Vector search</text>
    <rect x="465" y="0" width="10" height="3" fill="#00ACC1" rx="1"/>
    <text x="479" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#6b7394">Client</text>
  </g>
</svg>
