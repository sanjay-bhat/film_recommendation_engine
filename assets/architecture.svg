<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6D01"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3ECF8E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="#f7f8fa" rx="6"/>

  <!-- ═══════════════ OFFLINE PIPELINE SECTION ═══════════════ -->
  <rect x="30" y="40" width="840" height="150" rx="8" fill="#EDF2FA" stroke="#B8CCE4" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="450" y="62" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#5B7BA5" letter-spacing="2.5" font-weight="600">OFFLINE PIPELINE</text>

  <!-- Box 1: TMDb API -->
  <rect x="65" y="78" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="65" y="78" width="4" height="95" rx="2" fill="#4285F4"/>
  <circle cx="142" cy="105" r="13" fill="#EBF2FF" stroke="#4285F4" stroke-width="1.2"/>
  <text x="142" y="110" text-anchor="middle" font-size="13" fill="#4285F4" font-weight="bold">&#x2601;</text>
  <text x="142" y="132" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">TMDb API</text>
  <text x="142" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">4,800 movies</text>
  <text x="142" y="161" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">1,907 TV shows</text>

  <!-- Arrow 1-2 -->
  <line x1="224" y1="125" x2="268" y2="125" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="246" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" fill="#888">fetch</text>

  <!-- Box 2: Python ETL -->
  <rect x="275" y="78" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="275" y="78" width="4" height="95" rx="2" fill="#34A853"/>
  <circle cx="352" cy="105" r="13" fill="#E8F5E9" stroke="#34A853" stroke-width="1.2"/>
  <text x="352" y="110" text-anchor="middle" font-size="13" fill="#34A853" font-weight="bold">&#x2699;</text>
  <text x="352" y="132" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Python ETL</text>
  <text x="352" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">fetch &#xB7; clean &#xB7; merge</text>
  <text x="352" y="161" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">6,707 title catalog</text>

  <!-- Arrow 2-3 -->
  <line x1="434" y1="125" x2="478" y2="125" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="456" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" fill="#888">embed</text>

  <!-- Box 3: ML Engine -->
  <rect x="485" y="78" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="485" y="78" width="4" height="95" rx="2" fill="#7B61FF"/>
  <circle cx="562" cy="105" r="13" fill="#F0EBFF" stroke="#7B61FF" stroke-width="1.2"/>
  <text x="562" y="110" text-anchor="middle" font-size="12" fill="#7B61FF" font-weight="bold">&#x25C8;</text>
  <text x="562" y="132" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">ML Engine</text>
  <text x="562" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">MiniLM-L6-v2</text>
  <text x="562" y="161" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">384-dim embeddings</text>

  <!-- Arrow 3-4 -->
  <line x1="644" y1="125" x2="688" y2="125" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="666" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" fill="#888">k-NN</text>

  <!-- Box 4: Recommendations -->
  <rect x="695" y="78" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="695" y="78" width="4" height="95" rx="2" fill="#FF6D01"/>
  <circle cx="772" cy="105" r="13" fill="#FFF3E0" stroke="#FF6D01" stroke-width="1.2"/>
  <text x="772" y="110" text-anchor="middle" font-size="12" fill="#FF6D01" font-weight="bold">&#x2605;</text>
  <text x="772" y="132" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">Recommendations</text>
  <text x="772" y="148" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">FAISS nearest-neighbor</text>
  <text x="772" y="161" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">46,949 pairs</text>

  <!-- ═══════════════ VERTICAL MIGRATION ARROW ═══════════════ -->
  <line x1="772" y1="177" x2="772" y2="243" stroke="#FF6D01" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="790" y="215" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" fill="#FF6D01">migrate</text>

  <!-- ═══════════════ LIVE SERVING SECTION ═══════════════ -->
  <rect x="30" y="250" width="840" height="150" rx="8" fill="#E8F8F1" stroke="#A8D8C0" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="450" y="272" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#4E937A" letter-spacing="2.5" font-weight="600">LIVE SERVING</text>

  <!-- Box 5: Browser -->
  <rect x="65" y="288" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="65" y="288" width="4" height="95" rx="2" fill="#00ACC1"/>
  <circle cx="142" cy="315" r="13" fill="#E0F7FA" stroke="#00ACC1" stroke-width="1.2"/>
  <text x="142" y="320" text-anchor="middle" font-size="12" fill="#00ACC1" font-weight="bold">&#x25A3;</text>
  <text x="142" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Browser</text>
  <text x="142" y="358" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">Search &amp; Cover Flow</text>
  <text x="142" y="371" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">WebGL bokeh particles</text>

  <!-- Arrow 5-6 -->
  <line x1="224" y1="335" x2="268" y2="335" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="246" y="328" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" fill="#888">visit</text>

  <!-- Box 6: GitHub Pages -->
  <rect x="275" y="288" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="275" y="288" width="4" height="95" rx="2" fill="#333"/>
  <circle cx="352" cy="315" r="13" fill="#F5F5F5" stroke="#333" stroke-width="1.2"/>
  <text x="352" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">&#x29BE;</text>
  <text x="352" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">GitHub Pages</text>
  <text x="352" y="358" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">SPA &#xB7; PWA</text>
  <text x="352" y="371" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">offline-capable</text>

  <!-- Arrow 6-7 -->
  <line x1="434" y1="335" x2="478" y2="335" stroke="#3ECF8E" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="456" y="328" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" fill="#3ECF8E">query</text>

  <!-- Box 7: PostgREST API -->
  <rect x="485" y="288" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="485" y="288" width="4" height="95" rx="2" fill="#3ECF8E"/>
  <circle cx="562" cy="315" r="13" fill="#E3FCEF" stroke="#3ECF8E" stroke-width="1.2"/>
  <text x="562" y="320" text-anchor="middle" font-size="13" fill="#3ECF8E" font-weight="bold">&#x26A1;</text>
  <text x="562" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">PostgREST</text>
  <text x="562" y="358" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">REST + RPC</text>
  <text x="562" y="371" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">auto-generated API</text>

  <!-- Arrow 7-8 -->
  <line x1="644" y1="335" x2="688" y2="335" stroke="#3ECF8E" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="666" y="328" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" fill="#3ECF8E">SQL</text>

  <!-- Box 8: Supabase Postgres -->
  <rect x="695" y="288" width="155" height="95" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="695" y="288" width="4" height="95" rx="2" fill="#3ECF8E"/>
  <circle cx="772" cy="315" r="13" fill="#E3FCEF" stroke="#3ECF8E" stroke-width="1.2"/>
  <text x="772" y="320" text-anchor="middle" font-size="12" fill="#3ECF8E" font-weight="bold">&#x2395;</text>
  <text x="772" y="342" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">Supabase Postgres</text>
  <text x="772" y="358" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">6,707 titles</text>
  <text x="772" y="371" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#888">+ recommendations</text>

  <!-- ═══════════════ LEGEND ═══════════════ -->
  <g transform="translate(35, 408)">
    <rect x="0" y="0" width="8" height="3" fill="#4285F4" rx="1"/>
    <text x="12" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#999">Data Source</text>
    <rect x="80" y="0" width="8" height="3" fill="#34A853" rx="1"/>
    <text x="92" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#999">Processing</text>
    <rect x="155" y="0" width="8" height="3" fill="#7B61FF" rx="1"/>
    <text x="167" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#999">Machine Learning</text>
    <rect x="262" y="0" width="8" height="3" fill="#FF6D01" rx="1"/>
    <text x="274" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#999">Output</text>
    <rect x="315" y="0" width="8" height="3" fill="#3ECF8E" rx="1"/>
    <text x="327" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#999">Supabase</text>
    <rect x="380" y="0" width="8" height="3" fill="#00ACC1" rx="1"/>
    <text x="392" y="4" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8" fill="#999">Client</text>
  </g>
</svg>
