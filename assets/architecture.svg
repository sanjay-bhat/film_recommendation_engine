<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #0d0d12; }
      .title { fill: #c4a35a; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { fill: #726b5e; font-size: 11px; letter-spacing: 2px; }
      .box { rx: 10; ry: 10; stroke-width: 1.5; }
      .box-data { fill: #141420; stroke: #2a2a3a; }
      .box-pipeline { fill: #141420; stroke: #c4a35a; stroke-opacity: 0.4; }
      .box-engine { fill: #1a1a28; stroke: #c4a35a; stroke-opacity: 0.6; }
      .box-client { fill: #141420; stroke: #2a6b4a; }
      .box-infra { fill: #141420; stroke: #4a3a6b; }
      .box-label { fill: #e8e4dc; font-size: 13px; font-weight: 600; }
      .box-detail { fill: #726b5e; font-size: 10px; }
      .box-badge { font-size: 9px; font-weight: 600; letter-spacing: 1px; }
      .section-label { fill: #4a453e; font-size: 9px; font-weight: 700; letter-spacing: 3px; }
      .arrow { stroke: #3a3a4a; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-gold { stroke: #c4a35a; stroke-opacity: 0.5; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-gold); }
      .signal-row { fill: #726b5e; font-size: 9px; }
      .signal-pct { fill: #c4a35a; font-size: 9px; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a3a4a"/>
    </marker>
    <marker id="arrowhead-gold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c4a35a" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" class="bg"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">Film Recommendation Engine</text>
  <text x="600" y="58" text-anchor="middle" class="subtitle">SYSTEM ARCHITECTURE — V0.8.0</text>

  <!-- ═══════════════ DATA SOURCES (left column) ═══════════════ -->
  <text x="38" y="95" class="section-label">DATA SOURCES</text>

  <!-- TMDb 5000 -->
  <rect x="28" y="108" width="200" height="68" class="box box-data"/>
  <text x="48" y="132" class="box-label">TMDb 5000</text>
  <text x="48" y="147" class="box-detail">4,803 movies + credits</text>
  <text x="48" y="161" class="box-detail">Genres, keywords, cast, crew</text>
  <rect x="168" y="115" width="50" height="16" rx="3" fill="#2a2a3a"/>
  <text x="193" y="126" text-anchor="middle" class="box-badge" fill="#726b5e">CSV</text>

  <!-- MovieLens 25M -->
  <rect x="28" y="188" width="200" height="82" class="box box-data"/>
  <text x="48" y="212" class="box-label">MovieLens 25M</text>
  <text x="48" y="227" class="box-detail">25M ratings · 162K users</text>
  <text x="48" y="241" class="box-detail">58,945 collab movies</text>
  <text x="48" y="255" class="box-detail">13,803 genome-tagged movies</text>
  <rect x="168" y="195" width="50" height="16" rx="3" fill="#2a2a3a"/>
  <text x="193" y="206" text-anchor="middle" class="box-badge" fill="#726b5e">CSV</text>

  <!-- TMDb API -->
  <rect x="28" y="282" width="200" height="54" class="box box-data"/>
  <text x="48" y="306" class="box-label">TMDb API</text>
  <text x="48" y="320" class="box-detail">Plot overviews · Poster CDN</text>
  <rect x="168" y="289" width="50" height="16" rx="3" fill="#2a2a3a"/>
  <text x="193" y="300" text-anchor="middle" class="box-badge" fill="#726b5e">REST</text>

  <!-- ═══════════════ OFFLINE PIPELINES (center-left) ═══════════════ -->
  <text x="290" y="95" class="section-label">OFFLINE PIPELINES</text>

  <!-- Collab SVD -->
  <rect x="280" y="108" width="195" height="54" class="box box-pipeline"/>
  <text x="300" y="132" class="box-label">Collaborative SVD</text>
  <text x="300" y="147" class="box-detail">Truncated SVD k=50 on ratings</text>
  <rect x="415" y="115" width="50" height="16" rx="3" fill="rgba(196,163,90,0.15)"/>
  <text x="440" y="126" text-anchor="middle" class="box-badge" fill="#c4a35a">PY</text>

  <!-- Genome SVD -->
  <rect x="280" y="174" width="195" height="54" class="box box-pipeline"/>
  <text x="300" y="198" class="box-label">Genome Tag SVD</text>
  <text x="300" y="213" class="box-detail">1,128 tags → 50d via SVD</text>
  <rect x="415" y="181" width="50" height="16" rx="3" fill="rgba(196,163,90,0.15)"/>
  <text x="440" y="192" text-anchor="middle" class="box-badge" fill="#c4a35a">PY</text>

  <!-- Plot Embeddings -->
  <rect x="280" y="240" width="195" height="54" class="box box-pipeline"/>
  <text x="300" y="264" class="box-label">Plot Embeddings</text>
  <text x="300" y="279" class="box-detail">MiniLM-L6 384d → PCA 50d</text>
  <rect x="415" y="247" width="50" height="16" rx="3" fill="rgba(196,163,90,0.15)"/>
  <text x="440" y="258" text-anchor="middle" class="box-badge" fill="#c4a35a">PY</text>

  <!-- TF-IDF -->
  <rect x="280" y="306" width="195" height="54" class="box box-pipeline"/>
  <text x="300" y="330" class="box-label">Content TF-IDF</text>
  <text x="300" y="345" class="box-detail">Director + cast + keywords + genres</text>
  <rect x="415" y="313" width="50" height="16" rx="3" fill="rgba(196,163,90,0.15)"/>
  <text x="440" y="324" text-anchor="middle" class="box-badge" fill="#c4a35a">PY</text>

  <!-- Arrows: data → pipelines -->
  <path d="M228,142 L275,135" class="arrow"/>
  <path d="M228,220 L275,195" class="arrow"/>
  <path d="M228,230 L275,261" class="arrow"/>
  <path d="M228,142 L275,330" class="arrow"/>
  <path d="M228,309 L275,267" class="arrow"/>

  <!-- ═══════════════ PRE-COMPUTED FACTORS (center) ═══════════════ -->
  <text x="290" y="395" class="section-label">PRE-COMPUTED FACTORS</text>

  <rect x="280" y="408" width="195" height="86" class="box box-data"/>
  <text x="300" y="432" class="box-label">Factor Files</text>
  <text x="300" y="449" class="box-detail">item_factors.csv (27 MB)</text>
  <text x="300" y="463" class="box-detail">genome_factors.csv (6.5 MB)</text>
  <text x="300" y="477" class="box-detail">plot_factors.csv (2 MB)</text>

  <!-- Arrows: pipelines → factors -->
  <path d="M377,162 L377,403" class="arrow-gold"/>

  <!-- ═══════════════ RECOMMENDATION ENGINE (center-right) ═══════════════ -->
  <text x="530" y="95" class="section-label">RECOMMENDATION ENGINE</text>

  <!-- 4-Way Retrieval -->
  <rect x="530" y="108" width="220" height="104" class="box box-engine"/>
  <text x="550" y="132" class="box-label">4-Way Retrieval</text>
  <text x="550" y="150" class="box-detail">Content neighbors (TF-IDF Euclidean)</text>
  <text x="550" y="164" class="box-detail">Collaborative neighbors (cosine sim)</text>
  <text x="550" y="178" class="box-detail">Genome neighbors (cosine sim)</text>
  <text x="550" y="192" class="box-detail">Plot neighbors (cosine sim)</text>
  <rect x="690" y="115" width="50" height="16" rx="3" fill="rgba(196,163,90,0.15)"/>
  <text x="715" y="126" text-anchor="middle" class="box-badge" fill="#c4a35a">~120</text>

  <!-- 9-Signal Scoring -->
  <rect x="530" y="228" width="220" height="180" class="box box-engine"/>
  <text x="550" y="252" class="box-label">9-Signal Weighted Hybrid</text>
  <text x="550" y="272" class="signal-row">Content Similarity</text>
  <text x="720" y="272" class="signal-pct" text-anchor="end">25%</text>
  <text x="550" y="286" class="signal-row">Collaborative Filtering</text>
  <text x="720" y="286" class="signal-pct" text-anchor="end">15%</text>
  <text x="550" y="300" class="signal-row">Genre Jaccard</text>
  <text x="720" y="300" class="signal-pct" text-anchor="end">15%</text>
  <text x="550" y="314" class="signal-row">Plot Embeddings</text>
  <text x="720" y="314" class="signal-pct" text-anchor="end">10%</text>
  <text x="550" y="328" class="signal-row">Genome Tags</text>
  <text x="720" y="328" class="signal-pct" text-anchor="end">8%</text>
  <text x="550" y="342" class="signal-row">Actor Overlap</text>
  <text x="720" y="342" class="signal-pct" text-anchor="end">8%</text>
  <text x="550" y="356" class="signal-row">Director Match</text>
  <text x="720" y="356" class="signal-pct" text-anchor="end">7%</text>
  <text x="550" y="370" class="signal-row">Log Popularity</text>
  <text x="720" y="370" class="signal-pct" text-anchor="end">7%</text>
  <text x="550" y="384" class="signal-row">Year Proximity</text>
  <text x="720" y="384" class="signal-pct" text-anchor="end">5%</text>
  <rect x="690" y="235" width="50" height="16" rx="3" fill="rgba(196,163,90,0.15)"/>
  <text x="715" y="246" text-anchor="middle" class="box-badge" fill="#c4a35a">TOP 7</text>

  <!-- Sequel Dedup -->
  <rect x="530" y="424" width="220" height="42" class="box box-engine"/>
  <text x="550" y="448" class="box-label">Sequel Deduplication</text>
  <text x="550" y="460" class="box-detail">Fuzzy string matching</text>

  <!-- Arrows: retrieval → scoring → dedup -->
  <path d="M640,212 L640,223" class="arrow-gold"/>
  <path d="M640,408 L640,419" class="arrow-gold"/>

  <!-- Arrow: factors → engine -->
  <path d="M475,450 L525,316" class="arrow-gold"/>

  <!-- ═══════════════ CLI IMPLEMENTATIONS (bottom-left) ═══════════════ -->
  <text x="530" y="500" class="section-label">CLI IMPLEMENTATIONS</text>

  <rect x="530" y="513" width="105" height="40" class="box box-engine"/>
  <text x="547" y="535" class="box-label" font-size="11">Python</text>
  <rect x="589" y="519" width="38" height="14" rx="3" fill="rgba(196,163,90,0.15)"/>
  <text x="608" y="529" text-anchor="middle" class="box-badge" fill="#c4a35a" font-size="8">REF</text>

  <rect x="645" y="513" width="105" height="40" class="box box-engine"/>
  <text x="662" y="535" class="box-label" font-size="11">Rust</text>

  <rect x="530" y="563" width="105" height="40" class="box box-engine"/>
  <text x="547" y="585" class="box-label" font-size="11">C# (.NET 8)</text>

  <rect x="645" y="563" width="105" height="40" class="box box-engine"/>
  <text x="662" y="585" class="box-label" font-size="11">Go</text>

  <!-- ═══════════════ CLIENT APPS (right column) ═══════════════ -->
  <text x="810" y="95" class="section-label">CLIENT APPLICATIONS</text>

  <!-- Website / PWA -->
  <rect x="800" y="108" width="210" height="140" class="box box-client"/>
  <text x="820" y="132" class="box-label">Website (PWA)</text>
  <rect x="945" y="115" width="55" height="16" rx="3" fill="rgba(42,107,74,0.2)"/>
  <text x="972" y="126" text-anchor="middle" class="box-badge" fill="#2a6b4a">HTML/JS</text>
  <text x="820" y="150" class="box-detail">WebGL bokeh particles (GLSL)</text>
  <text x="820" y="164" class="box-detail">Cover Flow carousel (7 positions)</text>
  <text x="820" y="178" class="box-detail">4,800 movies · localStorage cache</text>
  <text x="820" y="192" class="box-detail">Service worker (cache-first)</text>
  <text x="820" y="206" class="box-detail">Responsive: Cover Flow / card list</text>
  <text x="820" y="220" class="box-detail">TMDb CDN posters (w342 / w154)</text>
  <text x="820" y="236" class="box-detail">GitHub Pages</text>

  <!-- Android -->
  <rect x="800" y="264" width="210" height="82" class="box box-client"/>
  <text x="820" y="288" class="box-label">Android</text>
  <rect x="945" y="271" width="55" height="16" rx="3" fill="rgba(42,107,74,0.2)"/>
  <text x="972" y="282" text-anchor="middle" class="box-badge" fill="#2a6b4a">KOTLIN</text>
  <text x="820" y="306" class="box-detail">Jetpack Compose · Material 3</text>
  <text x="820" y="320" class="box-detail">Cover Flow carousel</text>
  <text x="820" y="334" class="box-detail">Fully offline</text>

  <!-- iOS -->
  <rect x="800" y="358" width="210" height="82" class="box box-client"/>
  <text x="820" y="382" class="box-label">iOS</text>
  <rect x="945" y="365" width="55" height="16" rx="3" fill="rgba(42,107,74,0.2)"/>
  <text x="972" y="376" text-anchor="middle" class="box-badge" fill="#2a6b4a">SWIFT</text>
  <text x="820" y="400" class="box-detail">SwiftUI · async/await</text>
  <text x="820" y="414" class="box-detail">Cover Flow carousel</text>
  <text x="820" y="428" class="box-detail">Fully offline</text>

  <!-- Arrows: engine → clients -->
  <path d="M750,160 L795,170" class="arrow"/>
  <path d="M750,340 L795,310" class="arrow"/>
  <path d="M750,400 L795,400" class="arrow"/>

  <!-- ═══════════════ INFRASTRUCTURE (bottom) ═══════════════ -->
  <text x="38" y="500" class="section-label">INFRASTRUCTURE</text>

  <!-- Docker -->
  <rect x="28" y="513" width="200" height="54" class="box box-infra"/>
  <text x="48" y="537" class="box-label">Docker</text>
  <text x="48" y="552" class="box-detail">Containerized Python engine</text>
  <rect x="168" y="520" width="50" height="16" rx="3" fill="rgba(74,58,107,0.2)"/>
  <text x="193" y="531" text-anchor="middle" class="box-badge" fill="#6b5a9a">IMG</text>

  <!-- Terraform -->
  <rect x="28" y="579" width="200" height="54" class="box box-infra"/>
  <text x="48" y="603" class="box-label">Terraform</text>
  <text x="48" y="618" class="box-detail">Local Docker deployment config</text>
  <rect x="168" y="586" width="50" height="16" rx="3" fill="rgba(74,58,107,0.2)"/>
  <text x="193" y="597" text-anchor="middle" class="box-badge" fill="#6b5a9a">HCL</text>

  <!-- CI/CD -->
  <rect x="28" y="645" width="200" height="68" class="box box-infra"/>
  <text x="48" y="669" class="box-label">GitHub Actions</text>
  <text x="48" y="684" class="box-detail">CI: lint + test (Python, Rust, C#, Go)</text>
  <text x="48" y="698" class="box-detail">CodeQL: security scanning</text>
  <rect x="168" y="652" width="50" height="16" rx="3" fill="rgba(74,58,107,0.2)"/>
  <text x="193" y="663" text-anchor="middle" class="box-badge" fill="#6b5a9a">YAML</text>

  <!-- ═══════════════ DATA FLOW LEGEND ═══════════════ -->
  <text x="38" y="758" class="section-label">LEGEND</text>

  <rect x="28" y="770" width="14" height="14" rx="2" fill="#141420" stroke="#2a2a3a" stroke-width="1.5"/>
  <text x="50" y="782" class="box-detail">Data Source</text>

  <rect x="140" y="770" width="14" height="14" rx="2" fill="#141420" stroke="#c4a35a" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="162" y="782" class="box-detail">Pipeline / Engine</text>

  <rect x="280" y="770" width="14" height="14" rx="2" fill="#141420" stroke="#2a6b4a" stroke-width="1.5"/>
  <text x="302" y="782" class="box-detail">Client App</text>

  <rect x="390" y="770" width="14" height="14" rx="2" fill="#141420" stroke="#4a3a6b" stroke-width="1.5"/>
  <text x="412" y="782" class="box-detail">Infrastructure</text>

  <line x1="510" y1="777" x2="550" y2="777" class="arrow"/>
  <text x="560" y="782" class="box-detail">Data flow</text>

  <line x1="640" y1="777" x2="680" y2="777" class="arrow-gold"/>
  <text x="690" y="782" class="box-detail">Scoring pipeline</text>

  <!-- Version stamp -->
  <text x="1170" y="805" text-anchor="end" class="box-detail" font-size="9">v0.8.0 · 2026-08-21</text>
</svg>
