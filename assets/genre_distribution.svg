<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0015"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="barGlow" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGl" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#gbg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="22" letter-spacing="4" fill="#00e5ff" filter="url(#titleGl)">GENRE DISTRIBUTION — TMDb 5000</text>

  <!-- Subtle grid lines -->
  <g stroke="#ff2d95" stroke-width="0.3" opacity="0.15">
    <line x1="80" y1="70" x2="80" y2="420"/>
    <line x1="80" y1="420" x2="860" y2="420"/>
    <!-- Horizontal gridlines at 500, 1000, 1500, 2000 -->
    <line x1="80" y1="362" x2="860" y2="362" stroke-dasharray="4,4"/>
    <line x1="80" y1="303" x2="860" y2="303" stroke-dasharray="4,4"/>
    <line x1="80" y1="245" x2="860" y2="245" stroke-dasharray="4,4"/>
    <line x1="80" y1="187" x2="860" y2="187" stroke-dasharray="4,4"/>
    <line x1="80" y1="128" x2="860" y2="128" stroke-dasharray="4,4"/>
  </g>

  <!-- Y-axis labels -->
  <g font-family="'Courier New',monospace" font-size="11" fill="#ff6ec7" opacity="0.6" text-anchor="end">
    <text x="75" y="423">0</text>
    <text x="75" y="362">500</text>
    <text x="75" y="303">1000</text>
    <text x="75" y="245">1500</text>
    <text x="75" y="187">2000</text>
    <text x="75" y="128">2500</text>
  </g>

  <!-- Bars: max height = 350px (0 at y=420, 2500 at y=70), scale = 350/2500 = 0.14 px per unit -->
  <!-- 20 genres, bar width = 33, gap = 6, total = 20*39 = 780, start at x=90 -->
  <g filter="url(#barGlow)">
    <!-- Drama: 2297, h=322, y=98 -->
    <rect x="90" y="98" width="33" height="322" fill="url(#barGrad)" rx="2" opacity="0.9"/>
    <!-- Comedy: 1722, h=241, y=179 -->
    <rect x="129" y="179" width="33" height="241" fill="url(#barGrad)" rx="2" opacity="0.85"/>
    <!-- Thriller: 1274, h=178, y=242 -->
    <rect x="168" y="242" width="33" height="178" fill="url(#barGrad)" rx="2" opacity="0.8"/>
    <!-- Action: 1154, h=162, y=258 -->
    <rect x="207" y="258" width="33" height="162" fill="url(#barGrad)" rx="2" opacity="0.75"/>
    <!-- Romance: 894, h=125, y=295 -->
    <rect x="246" y="295" width="33" height="125" fill="url(#barGrad)" rx="2" opacity="0.7"/>
    <!-- Adventure: 790, h=111, y=309 -->
    <rect x="285" y="309" width="33" height="111" fill="url(#barGrad)" rx="2" opacity="0.68"/>
    <!-- Crime: 696, h=97, y=323 -->
    <rect x="324" y="323" width="33" height="97" fill="url(#barGrad)" rx="2" opacity="0.65"/>
    <!-- Sci-Fi: 535, h=75, y=345 -->
    <rect x="363" y="345" width="33" height="75" fill="url(#barGrad)" rx="2" opacity="0.62"/>
    <!-- Horror: 519, h=73, y=347 -->
    <rect x="402" y="347" width="33" height="73" fill="url(#barGrad)" rx="2" opacity="0.6"/>
    <!-- Family: 513, h=72, y=348 -->
    <rect x="441" y="348" width="33" height="72" fill="url(#barGrad)" rx="2" opacity="0.58"/>
    <!-- Fantasy: 454, h=64, y=356 -->
    <rect x="480" y="356" width="33" height="64" fill="url(#barGrad)" rx="2" opacity="0.55"/>
    <!-- Mystery: 348, h=49, y=371 -->
    <rect x="519" y="371" width="33" height="49" fill="url(#barGrad)" rx="2" opacity="0.52"/>
    <!-- Animation: 287, h=40, y=380 -->
    <rect x="558" y="380" width="33" height="40" fill="url(#barGrad)" rx="2" opacity="0.5"/>
    <!-- History: 251, h=35, y=385 -->
    <rect x="597" y="385" width="33" height="35" fill="url(#barGrad)" rx="2" opacity="0.48"/>
    <!-- Music: 196, h=27, y=393 -->
    <rect x="636" y="393" width="33" height="27" fill="url(#barGrad)" rx="2" opacity="0.45"/>
    <!-- War: 168, h=24, y=396 -->
    <rect x="675" y="396" width="33" height="24" fill="url(#barGrad)" rx="2" opacity="0.43"/>
    <!-- Documentary: 148, h=21, y=399 -->
    <rect x="714" y="399" width="33" height="21" fill="url(#barGrad)" rx="2" opacity="0.4"/>
    <!-- Foreign: 117, h=16, y=404 -->
    <rect x="753" y="404" width="33" height="16" fill="url(#barGrad)" rx="2" opacity="0.38"/>
    <!-- Western: 65, h=9, y=411 -->
    <rect x="792" y="411" width="33" height="9" fill="url(#barGrad)" rx="2" opacity="0.35"/>
    <!-- TV Movie: 22, h=3, y=417 -->
    <rect x="831" y="417" width="33" height="3" fill="url(#barGrad)" rx="2" opacity="0.32"/>
  </g>

  <!-- Count labels above bars -->
  <g font-family="'Courier New',monospace" font-size="10" fill="#00e5ff" text-anchor="middle" opacity="0.8">
    <text x="106" y="92">2297</text>
    <text x="145" y="173">1722</text>
    <text x="184" y="236">1274</text>
    <text x="223" y="252">1154</text>
    <text x="262" y="289">894</text>
    <text x="301" y="303">790</text>
    <text x="340" y="317">696</text>
    <text x="379" y="339">535</text>
    <text x="418" y="341">519</text>
    <text x="457" y="342">513</text>
    <text x="496" y="350">454</text>
    <text x="535" y="365">348</text>
    <text x="574" y="374">287</text>
    <text x="613" y="379">251</text>
    <text x="652" y="387">196</text>
    <text x="691" y="390">168</text>
    <text x="730" y="393">148</text>
    <text x="769" y="398">117</text>
    <text x="808" y="405">65</text>
    <text x="847" y="411">22</text>
  </g>

  <!-- X-axis genre labels (rotated) -->
  <g font-family="'Courier New',monospace" font-size="11" fill="#ff6ec7" opacity="0.7">
    <text x="106" y="438" text-anchor="end" transform="rotate(-55,106,438)">Drama</text>
    <text x="145" y="438" text-anchor="end" transform="rotate(-55,145,438)">Comedy</text>
    <text x="184" y="438" text-anchor="end" transform="rotate(-55,184,438)">Thriller</text>
    <text x="223" y="438" text-anchor="end" transform="rotate(-55,223,438)">Action</text>
    <text x="262" y="438" text-anchor="end" transform="rotate(-55,262,438)">Romance</text>
    <text x="301" y="438" text-anchor="end" transform="rotate(-55,301,438)">Adventure</text>
    <text x="340" y="438" text-anchor="end" transform="rotate(-55,340,438)">Crime</text>
    <text x="379" y="438" text-anchor="end" transform="rotate(-55,379,438)">Sci-Fi</text>
    <text x="418" y="438" text-anchor="end" transform="rotate(-55,418,438)">Horror</text>
    <text x="457" y="438" text-anchor="end" transform="rotate(-55,457,438)">Family</text>
    <text x="496" y="438" text-anchor="end" transform="rotate(-55,496,438)">Fantasy</text>
    <text x="535" y="438" text-anchor="end" transform="rotate(-55,535,438)">Mystery</text>
    <text x="574" y="438" text-anchor="end" transform="rotate(-55,574,438)">Animation</text>
    <text x="613" y="438" text-anchor="end" transform="rotate(-55,613,438)">History</text>
    <text x="652" y="438" text-anchor="end" transform="rotate(-55,652,438)">Music</text>
    <text x="691" y="438" text-anchor="end" transform="rotate(-55,691,438)">War</text>
    <text x="730" y="438" text-anchor="end" transform="rotate(-55,730,438)">Documentary</text>
    <text x="769" y="438" text-anchor="end" transform="rotate(-55,769,438)">Foreign</text>
    <text x="808" y="438" text-anchor="end" transform="rotate(-55,808,438)">Western</text>
    <text x="847" y="438" text-anchor="end" transform="rotate(-55,847,438)">TV Movie</text>
  </g>
</svg>
