<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0015"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="barGradTV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <filter id="barGlow" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGl" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#gbg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="22" letter-spacing="4" fill="#00e5ff" filter="url(#titleGl)">GENRE DISTRIBUTION &#x2014; 6,707 TITLES</text>

  <!-- Subtle grid lines -->
  <g stroke="#ff2d95" stroke-width="0.3" opacity="0.15">
    <line x1="80" y1="70" x2="80" y2="420"/>
    <line x1="80" y1="420" x2="860" y2="420"/>
    <!-- Horizontal gridlines at 500, 1000, 1500, 2000, 2500, 3000, 3500 -->
    <line x1="80" y1="370" x2="860" y2="370" stroke-dasharray="4,4"/>
    <line x1="80" y1="320" x2="860" y2="320" stroke-dasharray="4,4"/>
    <line x1="80" y1="270" x2="860" y2="270" stroke-dasharray="4,4"/>
    <line x1="80" y1="220" x2="860" y2="220" stroke-dasharray="4,4"/>
    <line x1="80" y1="170" x2="860" y2="170" stroke-dasharray="4,4"/>
    <line x1="80" y1="120" x2="860" y2="120" stroke-dasharray="4,4"/>
    <line x1="80" y1="70" x2="860" y2="70" stroke-dasharray="4,4"/>
  </g>

  <!-- Y-axis labels (scale: 0-3500, 350px height, 0.1 px/unit) -->
  <g font-family="'Courier New',monospace" font-size="11" fill="#ff6ec7" opacity="0.6" text-anchor="end">
    <text x="75" y="423">0</text>
    <text x="75" y="373">500</text>
    <text x="75" y="323">1000</text>
    <text x="75" y="273">1500</text>
    <text x="75" y="223">2000</text>
    <text x="75" y="173">2500</text>
    <text x="75" y="123">3000</text>
    <text x="75" y="73">3500</text>
  </g>

  <!-- Bars: max height = 350px (0 at y=420, 3500 at y=70), scale = 0.1 px per unit -->
  <!-- 20 genres, bar width = 33, gap = 6, total = 20*39 = 780, start at x=90 -->
  <g filter="url(#barGlow)">
    <!-- Drama: 3476, h=348, y=72 -->
    <rect x="90" y="72" width="33" height="348" fill="url(#barGrad)" rx="2" opacity="0.9"/>
    <!-- Comedy: 2433, h=243, y=177 -->
    <rect x="129" y="177" width="33" height="243" fill="url(#barGrad)" rx="2" opacity="0.85"/>
    <!-- Thriller: 1274, h=127, y=293 -->
    <rect x="168" y="293" width="33" height="127" fill="url(#barGrad)" rx="2" opacity="0.8"/>
    <!-- Action: 1154, h=115, y=305 -->
    <rect x="207" y="305" width="33" height="115" fill="url(#barGrad)" rx="2" opacity="0.75"/>
    <!-- Crime: 1038, h=104, y=316 -->
    <rect x="246" y="316" width="33" height="104" fill="url(#barGrad)" rx="2" opacity="0.72"/>
    <!-- Romance: 896, h=90, y=330 -->
    <rect x="285" y="330" width="33" height="90" fill="url(#barGrad)" rx="2" opacity="0.7"/>
    <!-- Animation: 819, h=82, y=338 -->
    <rect x="324" y="338" width="33" height="82" fill="url(#barGrad)" rx="2" opacity="0.68"/>
    <!-- Adventure: 789, h=79, y=341 -->
    <rect x="363" y="341" width="33" height="79" fill="url(#barGrad)" rx="2" opacity="0.65"/>
    <!-- Family: 701, h=70, y=350 -->
    <rect x="402" y="350" width="33" height="70" fill="url(#barGrad)" rx="2" opacity="0.62"/>
    <!-- Mystery: 672, h=67, y=353 -->
    <rect x="441" y="353" width="33" height="67" fill="url(#barGrad)" rx="2" opacity="0.6"/>
    <!-- Sci-Fi/Fantasy: 664, h=66, y=354 (TV genre) -->
    <rect x="480" y="354" width="33" height="66" fill="url(#barGradTV)" rx="2" opacity="0.7"/>
    <!-- Action/Adventure: 579, h=58, y=362 (TV genre) -->
    <rect x="519" y="362" width="33" height="58" fill="url(#barGradTV)" rx="2" opacity="0.65"/>
    <!-- Science Fiction: 533, h=53, y=367 -->
    <rect x="558" y="367" width="33" height="53" fill="url(#barGrad)" rx="2" opacity="0.52"/>
    <!-- Horror: 518, h=52, y=368 -->
    <rect x="597" y="368" width="33" height="52" fill="url(#barGrad)" rx="2" opacity="0.5"/>
    <!-- Fantasy: 424, h=42, y=378 -->
    <rect x="636" y="378" width="33" height="42" fill="url(#barGrad)" rx="2" opacity="0.48"/>
    <!-- History: 198, h=20, y=400 -->
    <rect x="675" y="400" width="33" height="20" fill="url(#barGrad)" rx="2" opacity="0.43"/>
    <!-- Music: 185, h=19, y=401 -->
    <rect x="714" y="401" width="33" height="19" fill="url(#barGrad)" rx="2" opacity="0.4"/>
    <!-- Documentary: 167, h=17, y=403 -->
    <rect x="753" y="403" width="33" height="17" fill="url(#barGrad)" rx="2" opacity="0.38"/>
    <!-- War: 144, h=14, y=406 -->
    <rect x="792" y="406" width="33" height="14" fill="url(#barGrad)" rx="2" opacity="0.35"/>
    <!-- Western: 104, h=10, y=410 -->
    <rect x="831" y="410" width="33" height="10" fill="url(#barGrad)" rx="2" opacity="0.32"/>
  </g>

  <!-- Count labels above bars -->
  <g font-family="'Courier New',monospace" font-size="10" fill="#00e5ff" text-anchor="middle" opacity="0.8">
    <text x="106" y="66">3476</text>
    <text x="145" y="171">2433</text>
    <text x="184" y="287">1274</text>
    <text x="223" y="299">1154</text>
    <text x="262" y="310">1038</text>
    <text x="301" y="324">896</text>
    <text x="340" y="332">819</text>
    <text x="379" y="335">789</text>
    <text x="418" y="344">701</text>
    <text x="457" y="347">672</text>
    <text x="496" y="348" fill="#ff6ec7">664</text>
    <text x="535" y="356" fill="#ff6ec7">579</text>
    <text x="574" y="361">533</text>
    <text x="613" y="362">518</text>
    <text x="652" y="372">424</text>
    <text x="691" y="394">198</text>
    <text x="730" y="395">185</text>
    <text x="769" y="397">167</text>
    <text x="808" y="400">144</text>
    <text x="847" y="404">104</text>
  </g>

  <!-- X-axis genre labels (rotated) -->
  <g font-family="'Courier New',monospace" font-size="11" fill="#ff6ec7" opacity="0.7">
    <text x="106" y="438" text-anchor="end" transform="rotate(-55,106,438)">Drama</text>
    <text x="145" y="438" text-anchor="end" transform="rotate(-55,145,438)">Comedy</text>
    <text x="184" y="438" text-anchor="end" transform="rotate(-55,184,438)">Thriller</text>
    <text x="223" y="438" text-anchor="end" transform="rotate(-55,223,438)">Action</text>
    <text x="262" y="438" text-anchor="end" transform="rotate(-55,262,438)">Crime</text>
    <text x="301" y="438" text-anchor="end" transform="rotate(-55,301,438)">Romance</text>
    <text x="340" y="438" text-anchor="end" transform="rotate(-55,340,438)">Animation</text>
    <text x="379" y="438" text-anchor="end" transform="rotate(-55,379,438)">Adventure</text>
    <text x="418" y="438" text-anchor="end" transform="rotate(-55,418,438)">Family</text>
    <text x="457" y="438" text-anchor="end" transform="rotate(-55,457,438)">Mystery</text>
    <text x="496" y="438" text-anchor="end" transform="rotate(-55,496,438)" fill="#ff2d95">Sci-Fi*</text>
    <text x="535" y="438" text-anchor="end" transform="rotate(-55,535,438)" fill="#ff2d95">Action*</text>
    <text x="574" y="438" text-anchor="end" transform="rotate(-55,574,438)">Sci-Fi</text>
    <text x="613" y="438" text-anchor="end" transform="rotate(-55,613,438)">Horror</text>
    <text x="652" y="438" text-anchor="end" transform="rotate(-55,652,438)">Fantasy</text>
    <text x="691" y="438" text-anchor="end" transform="rotate(-55,691,438)">History</text>
    <text x="730" y="438" text-anchor="end" transform="rotate(-55,730,438)">Music</text>
    <text x="769" y="438" text-anchor="end" transform="rotate(-55,769,438)">Documentary</text>
    <text x="808" y="438" text-anchor="end" transform="rotate(-55,808,438)">War</text>
    <text x="847" y="438" text-anchor="end" transform="rotate(-55,847,438)">Western</text>
  </g>

  <!-- Legend -->
  <g transform="translate(640, 54)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="url(#barGrad)" opacity="0.8"/>
    <text x="14" y="9" font-family="'Courier New',monospace" font-size="9" fill="#00e5ff" opacity="0.7">Movies</text>
    <rect x="60" y="0" width="10" height="10" rx="2" fill="url(#barGradTV)" opacity="0.8"/>
    <text x="74" y="9" font-family="'Courier New',monospace" font-size="9" fill="#ff6ec7" opacity="0.7">TV-specific genres</text>
  </g>
</svg>
